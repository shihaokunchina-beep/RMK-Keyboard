name: Build RMK firmware
on:
  workflow_dispatch:
  push:
    paths:
      - "**"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RUST_MIN_STACK: "67108864"
      RUST_TOOLCHAIN: "1.96.0"
    steps:
      - uses: actions/checkout@v6

      - name: Install rust toolchain helper
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Install cargo-binstall (used by other steps if needed)
        uses: cargo-bins/cargo-binstall@main

      # Build & install rmkit from its release so rmkit binary matches rmk config expectations
      - name: Build & install rmkit from v0.0.21
        run: |
          git clone --branch v0.0.21 https://github.com/rmk-rs/rmkit rmkit-src
          cd rmkit-src
          cargo install --path . --locked --force
          cd ..
          rm -rf rmkit-src

      - name: Get chip name
        id: capture
        run: |
          OUTPUT=$(rmkit get-chip --keyboard-toml-path "keyboard.toml")
          echo "Command output: $OUTPUT"
          echo "chip_name=$OUTPUT" >> "$GITHUB_OUTPUT"

      - name: Get project name
        id: project
        run: |
          OUTPUT=$(rmkit get-project-name --keyboard-toml-path "keyboard.toml")
          echo "Command output: $OUTPUT"
          echo "project_name=$OUTPUT" >> "$GITHUB_OUTPUT"

      - name: Compute artifact path prefix from keyboard.toml directory
        id: prefix
        env:
          KEYBOARD_TOML_PATH: "keyboard.toml"
        run: |
          DIR=$(dirname -- "$KEYBOARD_TOML_PATH")
          PREFIX=""
          if [ "$DIR" != "." ]; then
            PREFIX="$(printf '%s' "$DIR" | tr -c 'A-Za-z0-9._' '_')-"
          fi
          echo "prefix=$PREFIX" >> "$GITHUB_OUTPUT"

      # Install other tools and build as upstream does
      - name: Install cargo-make and flip-link
        run: cargo binstall cargo-make flip-link -y

      - name: Install esp toolchain (esp32s3 / Xtensa)
        if: ${{ steps.capture.outputs.chip_name == 'esp32s3' }}
        run: cargo binstall cargo-espflash espup -y

      - name: Cache ESP Rust toolchain
        if: ${{ steps.capture.outputs.chip_name == 'esp32s3' }}
        id: esp-toolchain-cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.rustup/toolchains/esp
            ~/export-esp.sh
          key: ${{ runner.os }}-esp-toolchain-${{ steps.capture.outputs.chip_name }}-v1

      - name: Prepare esp environment
        if: ${{ steps.capture.outputs.chip_name == 'esp32s3' && steps.esp-toolchain-cache.outputs.cache-hit != 'true' }}
        run: espup install

      - name: Create firmware project
        run: rmkit create --keyboard-toml-path "keyboard.toml" --vial-json-path "vial.json" --version "rmk-v0.8.2" --target-dir rmk

      - name: Pin generated Rust toolchain
        if: ${{ steps.capture.outputs.chip_name != 'esp32s3' }}
        working-directory: ./rmk
        run: |
          if [ -f rust-toolchain.toml ]; then
            sed -i "s/^channel = .*/channel = \"$RUST_TOOLCHAIN\"/" rust-toolchain.toml
            rustup toolchain install
          else
            rustup toolchain install "$RUST_TOOLCHAIN"
          fi

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rmk -> target"
          key: ${{ steps.capture.outputs.chip_name }}

      - name: Build firmware
        working-directory: ./rmk
        env:
          IS_XTENSA_ESP: ${{ steps.capture.outputs.chip_name == 'esp32s3' }}
        run: |
          if [ "$IS_XTENSA_ESP" = "true" ]; then
            . /home/runner/export-esp.sh
          else
            cargo build --release
          fi
          cargo make uf2 --release

      - name: Upload artifacts (uf2/hex/bin/elf as appropriate)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.prefix.outputs.prefix }}${{ steps.project.outputs.project_name }}-firmware
          path: rmk/*
