# Documentation: https://rmk.rs/docs/configuration.html
[keyboard]
# Replace with your keyboard identity.
name = "RMK Keyboard"
product_name = "RMK Keyboard"
vendor_id = 0x4c4b
product_id = 0x4643
manufacturer = "haobo"
chip = "esp32h2"
usb_enable = false

[matrix]
# Matrix pins are required.
# Note: esp32h2 exposes GPIO0-15 and GPIO22-27 (GPIO16-21 don't exist)
row_pins = ["GPIO2", "GPIO3", "GPIO4", "GPIO5"]
col_pins = ["GPIO12", "GPIO11", "GPIO10"]

# Default diode direction is col2row; set `row2col = true` if needed.
# row2col = true

[layout]
rows = 4
cols = 3
layers = 2
keymap = [
    [
        ["Kc7", "Kc8", "Kc9"],
        ["Kc4", "Kc5", "Kc6"],
        ["Kcl", "Kc2", "Kc3"],
        ["MO(1)", "Kc0", "Enter"]
    ],
    [
        ["User0", "User1", "User2"],
        ["LCtrl", "User5", "RCtrl"],
        ["LGui", "Space", "RGui"],
        ["_", "_", "_"]
    ],
]

[light]
# All light pins are high-active by default, uncomment if you want it to be low-active
# capslock.pin = "GPIO8"
# capslock.low_active = true
# scrolllock.pin = "GPIO9"
# scrolllock.low_active = true
# Just ignore if no light pin is used for it
# numslock.pin = "GPIO10"
# numslock.low_active = true

# Storage is enabled by default.
[storage]
enabled = true

[ble]
enabled = true

